<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>404 — Страница не найдена | Umbot Flow Editor</title>
        <meta name="description" content="Страница не найдена. Перейдите на главную, в редактор ботов или документацию Umbot Flow Editor." />
        <meta name="robots" content="noindex, follow" />
        <style>
            /* Токены — как в редакторе (dark) */
            :root {
                --bg: #0a0a0f;
                --surface: #12121a;
                --fg: #e8e8ef;
                --fg-dim: rgba(232, 232, 239, 0.55);
                --fg-faint: rgba(232, 232, 239, 0.38);
                --accent: #00f0ff;
                --node-start: #22c55e;
                --node-condition: #ff0055;
                --node-end: #ef4444;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    'Inter',
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                background: var(--bg);
                color: var(--fg);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                overflow-x: hidden;
            }

            /* сетка холста */
            .bg-grid {
                position: fixed;
                inset: 0;
                background-image:
                    linear-gradient(rgba(232, 232, 239, 0.04) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(232, 232, 239, 0.04) 1px, transparent 1px);
                background-size: 36px 36px;
                mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 100%);
                -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 30%, transparent 100%);
                pointer-events: none;
            }

            .wrap {
                position: relative;
                text-align: center;
                max-width: 640px;
            }

            /* ===== Сцена: «битое ребро» ===== */
            .scene {
                position: relative;
                height: 150px;
                margin-bottom: 8px;
            }

            .scene svg {
                width: 100%;
                height: 100%;
                overflow: visible;
            }

            .node {
                fill: var(--surface);
                stroke-width: 1.2;
            }

            .edge-ok {
                fill: none;
                stroke: rgba(232, 232, 239, 0.25);
                stroke-width: 1.5;
            }

            .edge-broken {
                fill: none;
                stroke: var(--node-end);
                stroke-width: 1.5;
                stroke-dasharray: 7 6;
                animation: dash-run 0.9s linear infinite;
            }

            @keyframes dash-run {
                to {
                    stroke-dashoffset: -13;
                }
            }

            /* искра, падающая с обрыва */
            .falling-spark {
                fill: var(--node-end);
                filter: drop-shadow(0 0 5px var(--node-end));
                animation: spark-fall 1.6s ease-in infinite;
                opacity: 0;
            }

            @keyframes spark-fall {
                0% {
                    opacity: 0;
                    transform: translate(140px, 28px);
                }
                15% {
                    opacity: 1;
                }
                100% {
                    opacity: 0;
                    transform: translate(140px, 110px) scale(0.4);
                }
            }

            .x-mark {
                fill: none;
                stroke: var(--node-end);
                stroke-width: 3;
                stroke-linecap: round;
                animation: x-appear 0.5s ease-out both;
            }

            @keyframes x-appear {
                from {
                    transform: scale(0.4);
                    opacity: 0;
                }
            }

            h1 {
                font-size: clamp(4.5rem, 14vw, 8rem);
                font-weight: 700;
                line-height: 1;
                letter-spacing: -0.03em;
                background: linear-gradient(92deg, var(--accent), var(--node-condition));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                margin-bottom: 10px;
            }

            .sub {
                font-size: 1.25rem;
                color: var(--fg-dim);
                margin-bottom: 8px;
            }

            .hint {
                font-size: 0.95rem;
                color: var(--fg-faint);
                margin-bottom: 34px;
            }

            .hint code {
                font-family: 'SF Mono', Consolas, monospace;
                font-size: 0.85em;
                color: var(--accent);
                background: rgba(0, 240, 255, 0.08);
                border: 1px solid rgba(0, 240, 255, 0.2);
                padding: 2px 8px;
                border-radius: 6px;
                word-break: break-all;
            }

            .actions {
                display: flex;
                gap: 14px;
                justify-content: center;
                flex-wrap: wrap;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 13px 26px;
                border-radius: 11px;
                font-size: 15px;
                font-weight: 600;
                text-decoration: none;
                transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            }

            .btn-primary {
                color: #051015;
                background: linear-gradient(135deg, var(--accent), #bc13fe);
                box-shadow: 0 6px 26px rgba(0, 240, 255, 0.22);
            }

            .btn-primary:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 34px rgba(0, 240, 255, 0.35);
            }

            .btn-ghost {
                color: var(--fg);
                border: 1px solid rgba(232, 232, 239, 0.16);
                background: rgba(232, 232, 238, 0.04);
            }

            .btn-ghost:hover {
                border-color: rgba(0, 240, 255, 0.4);
                transform: translateY(-2px);
            }

            footer {
                position: fixed;
                bottom: 18px;
                left: 0;
                right: 0;
                text-align: center;
                font-size: 13px;
                color: var(--fg-faint);
            }

            footer a {
                color: var(--fg-dim);
                text-decoration: none;
            }

            footer a:hover {
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <div class="bg-grid" aria-hidden="true"></div>
        <main class="wrap">
            <div class="scene" aria-hidden="true">
                <!-- Флоу-метафора: ребро оборвалось — путь не найден -->
                <svg viewBox="0 0 340 150">
                    <!-- нода-источник -->
                    <rect class="node" x="40" y="21" width="120" height="46" rx="10" stroke="#22c55e" />
                    <text x="100" y="40" text-anchor="middle" fill="#e8e8ef" font-size="12" font-weight="500" font-family="Inter, sans-serif">Путь был здесь</text>
                    <text x="100" y="56" text-anchor="middle" fill="rgba(232,232,239,.38)" font-size="9" font-family="Inter, sans-serif">node: exists</text>

                    <!-- целая часть ребра -->
                    <path class="edge-ok" d="M 160 44 C 185 44, 195 44, 210 44" />

                    <!-- обрыв: пунктир уходит «в никуда» -->
                    <path class="edge-broken" d="M 210 44 C 235 44, 250 30, 262 22" />

                    <!-- место, где узла нет — крест -->
                    <g transform="translate(278, 12)">
                        <path class="x-mark" d="M 0 0 L 20 20 M 20 0 L 0 20" />
                    </g>

                    <!-- падающая искра -->
                    <circle class="falling-spark" r="3.2" cx="0" cy="0" />

                    <!-- нода-призрак (пустая) -->
                    <rect x="248" y="86" width="120" height="46" rx="10" fill="none" stroke="rgba(239,68,68,.35)" stroke-dasharray="5 4" />
                    <text x="308" y="105" text-anchor="middle" fill="rgba(239,68,68,.7)" font-size="12" font-weight="500" font-family="Inter, sans-serif">404</text>
                    <text x="308" y="121" text-anchor="middle" fill="rgba(239,68,68,.45)" font-size="9" font-family="Inter, sans-serif">node: not found</text>
                </svg>
            </div>

            <h1>404</h1>
            <p class="sub">Такого блока в вашем флоу нет</p>
            <p class="hint">
                Путь <code id="path">/</code> не найден — ребро оборвано.
                Соедините его с одной из существующих нод:
            </p>

            <div class="actions">
                <a class="btn btn-primary" href="/">На главную →</a>
                <a class="btn btn-ghost" href="/app">Открыть редактор</a>
                <a class="btn btn-ghost" href="/docs/">Документация</a>
            </div>
        </main>

        <footer>
            Umbot Flow Editor · <a href="/">flow.maxim-m.ru</a>
        </footer>

        <script>
            // Показываем пользователю путь, который он запрашивал (только для
            // отображения, не для исполнения)
            try {
                document.getElementById('path').textContent = location.pathname + location.search;
            } catch (e) {
                /* путь недоступен — оставляем / */
            }
        </script>
    </body>
</html>
